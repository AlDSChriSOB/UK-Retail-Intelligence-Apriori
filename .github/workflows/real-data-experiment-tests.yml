name: Real-data experiment code checks
on:
  pull_request:
    paths:
      - 'src/real_data_apriori_experiment.py'
      - 'tests/test_real_data_apriori_experiment.py'
      - '.github/workflows/real-data-experiment-tests.yml'
  push:
    branches:
      - experiment/real-uci-apriori-runtime-20261118
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_real_data_apriori_experiment.py
