name: Full Apriori validation
on:
  push:
    branches:
      - feature/full-apriori-validation-20261118
  pull_request:
    paths:
      - 'src/full_apriori.py'
      - 'tests/test_full_apriori.py'
      - '.github/workflows/full-apriori-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt mlxtend
      - run: python -m pytest -q tests/test_full_apriori.py -rs
