name: Submission evidence and figures
on:
  push:
    branches: [research/submission-package-20261120]
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_robust_benchmark.py
      - name: Download official UCI workbook
        run: |
          python - <<'PY'
          from src.data import download_dataset, extract_dataset
          print(extract_dataset(download_dataset()))
          PY
      - name: Record exact environment and source checksum
        run: |
          python -m pip freeze > reports/environment-freeze.txt
          sha256sum "data/raw/Online Retail.xlsx" > reports/uci-workbook-sha256.txt
      - name: Reproduce benchmark
        run: python -m src.robust_benchmark "data/raw/Online Retail.xlsx" --bootstrap 300
      - name: Create paper figures and supplement
        run: python -m src.paper_figures reports/generated/robust_benchmark.json
      - name: Upload submission evidence
        uses: actions/upload-artifact@v4
        with:
          name: submission-evidence-and-figures
          path: |
            reports/generated/robust_benchmark.json
            reports/generated/paper_figures/
            reports/environment-freeze.txt
            reports/uci-workbook-sha256.txt
          if-no-files-found: error
