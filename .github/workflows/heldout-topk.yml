name: Real UCI held-out top-K recommendation evaluation
on:
  push:
    branches: [research/heldout-topk-evaluation-20261118]
    paths:
      - 'src/heldout_topk.py'
      - 'tests/test_heldout_topk.py'
      - '.github/workflows/heldout-topk.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_heldout_topk.py
      - name: Download official UCI workbook
        run: |
          python - <<'PY'
          from src.data import download_dataset, extract_dataset
          print(extract_dataset(download_dataset()))
          PY
      - name: Execute held-out basket completion
        run: python -m src.heldout_topk "data/raw/Online Retail.xlsx" --bootstrap 500
      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-topk-real-uci-evidence
          path: reports/generated/heldout_topk.json
          if-no-files-found: warn
