name: Project 07 FP-Growth cold-start real UCI
on:
  push:
    branches: [research/project-07-fpgrowth-cold-start]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Test train-only frequency stratification
        run: python -m pytest -q tests/test_project07_fpgrowth_cold_start.py
      - name: Download official UCI workbook
        run: |
          python - <<'PY'
          from src.data import download_dataset,extract_dataset
          print(extract_dataset(download_dataset()))
          PY
      - name: Evaluate real UK invoices and baselines
        run: python -m projects.project07_fpgrowth_cold_start.analysis "data/raw/Online Retail.xlsx"
      - name: Generate evidence-derived manuscript and figures
        run: python -m projects.project07_fpgrowth_cold_start.paper reports/generated/project07_cold_start.json
      - name: Upload verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: project07-fpgrowth-cold-start-evidence
          if-no-files-found: error
          path: |
            reports/generated/project07_cold_start.json
            reports/generated/project07_paper/
