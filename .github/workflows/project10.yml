name: Project 10 real-data benchmark
on:
  pull_request:
    paths:
      - 'src/project10.py'
      - 'tests/test_project10.py'
      - '.github/workflows/project10.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_project10.py -q
      - run: python -m src.project10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project10-evidence
          path: |
            reports/generated/project10/evidence.json
            reports/generated/project10/summary.csv
            reports/generated/project10/*.png
            reports/generated/project10/*.pdf
