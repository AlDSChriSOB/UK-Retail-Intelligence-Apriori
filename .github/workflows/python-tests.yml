name: Python tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate notebook and application syntax
        run: |
          python -m py_compile app.py src/recommendation_benchmark.py src/paired_bootstrap.py src/catalogue_sensitivity.py
          python -c "import nbformat; p='notebooks/02_recommendation_research.ipynb'; nbformat.validate(nbformat.read(p, as_version=4)); print('Notebook schema valid')"
      - name: Run unit tests
        run: python -m pytest -q
