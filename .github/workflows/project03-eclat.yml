name: Project 03 Eclat real UCI evidence
on:
  push:
    branches: [research/project-03-eclat]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Test vertical Eclat correctness
        run: python -m pytest -q tests/test_project03_eclat.py tests/test_project02_fpgrowth.py tests/test_project02_recommendation.py
      - name: Download official UCI Online Retail workbook
        run: |
          python - <<'PY'
          from src.data import download_dataset, extract_dataset
          print(extract_dataset(download_dataset()))
          PY
      - name: Three-way real-data itemset and cost comparison
        run: python -m projects.project03_eclat.mining "data/raw/Online Retail.xlsx"
      - name: Chronological recommendation and paired bootstrap analysis
        run: python -m projects.project03_eclat.recommendation "data/raw/Online Retail.xlsx"
      - name: Generate publication figures and evidence-only manuscript
        run: python -m projects.project03_eclat.paper reports/generated/project03_mining.json reports/generated/project03_recommendation.json
      - name: Upload verified research outputs
        uses: actions/upload-artifact@v4
        with:
          name: project03-eclat-real-uci
          if-no-files-found: error
          path: |
            reports/generated/project03_mining.json
            reports/generated/project03_recommendation.json
            reports/generated/project03_paper/
