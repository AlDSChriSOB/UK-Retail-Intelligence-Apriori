name: Real UCI robust sensitivity and competing recommenders
on:
  push:
    branches: [research/robust-benchmarks-manuscript-20261120]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_robust_benchmark.py tests/test_heldout_topk.py tests/test_temporal_clustered.py
      - name: Download original UCI data
        run: |
          python - <<'PY'
          from src.data import download_dataset, extract_dataset
          print(extract_dataset(download_dataset()))
          PY
      - name: Execute pre-specified robustness grid
        run: python -m src.robust_benchmark "data/raw/Online Retail.xlsx" --bootstrap 300
      - name: Upload real-data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robust-real-uci-benchmark
          path: reports/generated/robust_benchmark.json
          if-no-files-found: warn
