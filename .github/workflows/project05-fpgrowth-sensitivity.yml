name: Project 05 FP-Growth sensitivity real UCI
on:
  push:
    branches: [research/project-05-fpgrowth-sensitivity]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Test FP-Growth threshold monotonicity
        run: python -m pytest -q tests/test_project05_fpgrowth_sensitivity.py
      - name: Download official UCI workbook
        run: |
          python - <<'PY'
          from src.data import download_dataset,extract_dataset
          print(extract_dataset(download_dataset()))
          PY
      - name: Run 27 real-data sensitivity configurations
        run: python -m projects.project05_fpgrowth_sensitivity.analysis "data/raw/Online Retail.xlsx"
      - name: Generate evidence-only manuscript and figures
        run: python -m projects.project05_fpgrowth_sensitivity.paper reports/generated/project05_sensitivity.json
      - name: Upload verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: project05-fpgrowth-sensitivity-real-uci
          if-no-files-found: error
          path: |
            reports/generated/project05_sensitivity.json
            reports/generated/project05_paper/
