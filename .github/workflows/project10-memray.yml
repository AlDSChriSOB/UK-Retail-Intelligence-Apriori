name: Project 10 independent allocation validation
on:
  pull_request:
    paths:
      - 'src/project10_memray.py'
      - '.github/workflows/project10-memray.yml'
  workflow_dispatch:
jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt memray
      - run: python -m src.project10_memray
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project10-memray-evidence
          path: reports/generated/project10_memray/
